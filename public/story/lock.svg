<?xml version="1.0" encoding="UTF-8"?>
<svg style="--accent:#FFB020" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360"><style>
.packet{animation:packet-run 1.6s cubic-bezier(.45,0,.6,1) infinite}
@keyframes packet-run{from{transform:translateX(-36px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateX(var(--len));opacity:0}}
.lock-dot{transform-box:fill-box;transform-origin:center;animation:lock-pulse 1.8s ease-in-out infinite}
@keyframes lock-pulse{50%{transform:scale(1.6);opacity:.5}}
.cloud{transform-box:fill-box;transform-origin:center;animation:cloud-breathe 3.2s ease-in-out infinite}
@keyframes cloud-breathe{50%{transform:scale(.82);opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="150" y="70" width="220" height="56" rx="28" fill="var(--accent)" fill-opacity="0.08" stroke="rgb(255 255 255 / 0.35)"></rect><text x="260" y="58" text-anchor="middle" fill="#9AA7B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Rb / Cs vapour cell</text><line x1="60" y1="92" x2="460" y2="92" stroke="var(--accent)" stroke-width="2"></line><line x1="460" y1="104" x2="60" y2="104" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1.5"></line><g transform="translate(60 92) rotate(0)"><g class="packet" style="--len:380px;animation-duration:2s;animation-delay:0s"><rect x="0" y="-1.5" width="30" height="3" rx="1.5" fill="var(--accent)" opacity="0.55"></rect><rect x="22" y="-2" width="12" height="4" rx="2" fill="#fff"></rect></g></g><g transform="translate(460 104) rotate(180)"><g class="packet" style="--len:380px;animation-duration:2s;animation-delay:1s"><rect x="0" y="-1.5" width="30" height="3" rx="1.5" fill="var(--accent)" opacity="0.55"></rect><rect x="22" y="-2" width="12" height="4" rx="2" fill="#fff"></rect></g></g><g transform="translate(70 170)"><line x1="0" y1="140" x2="380" y2="140" stroke="rgb(255 255 255 / 0.22)"></line><path d="M0 20 C 90 20 110 24 140 60 C 152 76 158 100 166 116 L 172 82 L 178 112 L 186 94 L 192 120 C 202 100 214 70 236 46 C 260 22 300 20 380 20" fill="none" stroke="var(--accent)" stroke-width="2"></path><circle cx="178" cy="112" r="5" fill="#fff" class="lock-dot"></circle><text x="190" y="160" fill="#9AA7B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">locked</text></g></svg>
