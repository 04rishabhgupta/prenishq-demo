<?xml version="1.0" encoding="UTF-8"?>
<svg style="--accent:#FF2A3D" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360"><style>
.packet{animation:packet-run 1.6s cubic-bezier(.45,0,.6,1) infinite}
@keyframes packet-run{from{transform:translateX(-36px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateX(var(--len));opacity:0}}
.lock-dot{transform-box:fill-box;transform-origin:center;animation:lock-pulse 1.8s ease-in-out infinite}
@keyframes lock-pulse{50%{transform:scale(1.6);opacity:.5}}
.cloud{transform-box:fill-box;transform-origin:center;animation:cloud-breathe 3.2s ease-in-out infinite}
@keyframes cloud-breathe{50%{transform:scale(.82);opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><path d="M170 168 L 350 120 L 350 240 L 170 192 Z" fill="var(--accent)" fill-opacity="0.12" stroke="rgb(255 255 255 / 0.35)"></path><line x1="40" y1="180" x2="170" y2="180" stroke="var(--accent)" stroke-width="1.5"></line><path d="M350 140 L 480 120 L 480 240 L 350 220 Z" fill="var(--accent)" fill-opacity="0.35"></path><line x1="350" y1="180" x2="480" y2="180" stroke="#fff" stroke-width="2.5"></line><g transform="translate(40 180) rotate(0)"><g class="packet" style="--len:130px;animation-duration:1.2s;animation-delay:0s"><rect x="0" y="-1.5" width="30" height="3" rx="1.5" fill="var(--accent)" opacity="0.55"></rect><rect x="22" y="-2" width="12" height="4" rx="2" fill="#fff"></rect></g></g><g transform="translate(350 180) rotate(0)"><g class="packet" style="--len:130px;animation-duration:1.2s;animation-delay:0.6s"><rect x="0" y="-1.5" width="30" height="3" rx="1.5" fill="var(--accent)" opacity="0.55"></rect><rect x="22" y="-2" width="12" height="4" rx="2" fill="#fff"></rect></g></g><text x="105" y="160" text-anchor="middle" fill="#9AA7B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">seed · mW</text><text x="260" y="270" text-anchor="middle" fill="#9AA7B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">tapered gain section</text><text x="430" y="104" text-anchor="middle" fill="#9AA7B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">&gt; 2 W out</text></svg>
